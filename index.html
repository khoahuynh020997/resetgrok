<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý & Đếm ngược Tài khoản Giới hạn</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-full flex flex-col justify-between antialiased">

    <div class="max-w-4xl mx-auto w-full p-4 sm:p-6 flex-grow flex flex-col">
        <!-- Header -->
        <header class="flex flex-col sm:flex-row items-center justify-between border-b border-slate-800 pb-4 mb-6">
            <div>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">Bộ Đếm Reset Tài Khoản</h1>
                <p class="text-sm text-slate-400 mt-1">Theo dõi thời gian khôi phục 24 giờ khi tài khoản bị giới hạn.</p>
            </div>
            <div class="mt-4 sm:mt-0 flex items-center gap-3">
                <button onclick="requestNotificationPermission()" id="notification-btn" class="bg-slate-800 hover:bg-slate-700 border border-slate-700/50 text-slate-300 text-xs px-3 py-2 rounded-xl transition-all flex items-center gap-1.5 cursor-pointer">
                    <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                    <span id="notif-text">Bật thông báo</span>
                </button>
                <div class="bg-slate-800/80 px-4 py-2 rounded-xl border border-slate-700/50 flex items-center gap-2">
                    <span class="text-xs text-slate-400">Tổng tài khoản:</span>
                    <span id="total-count" class="text-lg font-bold text-blue-400">0</span>
                </div>
            </div>
        </header>

        <!-- Form Input Section -->
        <section class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-5 mb-6 shadow-xl backdrop-blur-sm">
            <h2 class="text-lg font-semibold mb-4 text-slate-200">Thêm tài khoản mới</h2>
            <form id="account-form" class="space-y-4">
                <div>
                    <label for="account-name" class="block text-sm font-medium text-slate-300 mb-1">Tên tài khoản / Ghi chú</label>
                    <input type="text" id="account-name" required placeholder="Nhập tên tài khoản (VD: taikhoan01@gmail.com)..."
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                </div>
                
                <div class="flex items-center gap-3 bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                    <input type="checkbox" id="is-limited" class="w-5 h-5 text-blue-600 bg-slate-900 border-slate-700 rounded focus:ring-blue-500 focus:ring-2 cursor-pointer">
                    <label for="is-limited" class="text-sm font-medium text-slate-300 cursor-pointer select-none">
                        Tài khoản đã hết hạn / giới hạn ngay lúc thêm? <span class="text-xs text-slate-400 block font-normal">Sẽ bắt đầu đếm ngược 24 giờ lập tức.</span>
                    </label>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-medium py-3 px-4 rounded-xl shadow-lg shadow-blue-500/20 active:scale-[0.99] transition-all flex items-center justify-center gap-2 cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Thêm Tài Khoản
                </button>
            </form>
        </section>

        <section class="flex-grow">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold text-slate-200">Danh sách tài khoản</h2>
                <div class="flex gap-2">
                    <button onclick="filterAccounts('all')" id="filter-all" class="text-xs px-3 py-1.5 rounded-lg bg-blue-600 text-white font-medium transition-colors cursor-pointer">Tất cả</button>
                    <button onclick="filterAccounts('limited')" id="filter-limited" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 text-slate-400 hover:bg-slate-700 transition-colors cursor-pointer">Đang đếm ngược</button>
                    <button onclick="filterAccounts('normal')" id="filter-normal" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 text-slate-400 hover:bg-slate-700 transition-colors cursor-pointer">Bình thường</button>
                </div>
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden flex flex-col items-center justify-center p-10 text-center border border-dashed border-slate-700 rounded-2xl bg-slate-800/20">
                <svg class="w-16 h-16 text-slate-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                <p class="text-slate-400 font-medium">Chưa có tài khoản nào được thêm.</p>
                <p class="text-xs text-slate-500 mt-1">Hãy nhập tên và thêm tài khoản ở form phía trên.</p>
            </div>

            <!-- List Grid -->
            <div id="accounts-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Dynamic cards will be appended here -->
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        Ứng dụng quản lý tài khoản & đếm ngược reset 24h &copy; 2026
    </footer>

    <script>
        // State Management
        let accounts = JSON.parse(localStorage.getItem('reset_tracker_accounts')) || [];
        let currentFilter = 'all';

        // DOM Elements
        const form = document.getElementById('account-form');
        const nameInput = document.getElementById('account-name');
        const limitedCheckbox = document.getElementById('is-limited');
        const container = document.getElementById('accounts-container');
        const emptyState = document.getElementById('empty-state');
        const totalCountEl = document.getElementById('total-count');
        const notifText = document.getElementById('notif-text');

        // Check notification permission state on load
        if ("Notification" in window) {
            if (Notification.permission === "granted") {
                notifText.textContent = "Đã bật thông báo";
            } else if (Notification.permission === "denied") {
                notifText.textContent = "Đã chặn thông báo";
            }
        }

        function requestNotificationPermission() {
            if (!("Notification" in window)) {
                alert("Trình duyệt của bạn không hỗ trợ thông báo.");
                return;
            }

            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    notifText.textContent = "Đã bật thông báo";
                    new Notification("Thông báo hệ thống", { body: "Bạn sẽ nhận được thông báo khi tài khoản hoàn tất reset 24h!" });
                } else {
                    notifText.textContent = "Đã chặn thông báo";
                }
            });
        }

        // Play Beep Sound using Web Audio API
        function playBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5 note
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            } catch (e) {
                console.log("Audio Context prevented or not supported.");
            }
        }

        // Save to LocalStorage
        function saveAccounts() {
            localStorage.setItem('reset_tracker_accounts', JSON.stringify(accounts));
            updateTotalCount();
        }

        function updateTotalCount() {
            totalCountEl.textContent = accounts.length;
        }

        // Form Submission
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = nameInput.value.trim();
            if (!name) return;

            const isLimited = limitedCheckbox.checked;
            const now = Date.now();
            
            const newAccount = {
                id: 'acc_' + now + Math.random().toString(36).substr(2, 5),
                name: name,
                isLimited: isLimited,
                endTime: isLimited ? now + (24 * 60 * 60 * 1000) : null,
                startTime: isLimited ? now : null,
                notified: false // Track if notification was sent
            };

            accounts.unshift(newAccount);
            saveAccounts();
            renderAccounts();

            nameInput.value = '';
            limitedCheckbox.checked = false;
            nameInput.focus();
        });

        window.toggleLimit = function(id) {
            const acc = accounts.find(a => a.id === id);
            if (!acc) return;

            acc.isLimited = !acc.isLimited;
            if (acc.isLimited) {
                acc.startTime = Date.now();
                acc.endTime = Date.now() + (24 * 60 * 60 * 1000);
                acc.notified = false;
            } else {
                acc.startTime = null;
                acc.endTime = null;
                acc.notified = false;
            }
            saveAccounts();
            renderAccounts();
        };

        window.resetTimer = function(id) {
            const acc = accounts.find(a => a.id === id);
            if (!acc) return;

            acc.isLimited = true;
            acc.startTime = Date.now();
            acc.endTime = Date.now() + (24 * 60 * 60 * 1000);
            acc.notified = false;
            saveAccounts();
            renderAccounts();
        };

        window.deleteAccount = function(id) {
            accounts = accounts.filter(a => a.id !== id);
            saveAccounts();
            renderAccounts();
        };

        window.filterAccounts = function(filter) {
            currentFilter = filter;
            ['all', 'limited', 'normal'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if (f === filter) {
                    btn.className = 'text-xs px-3 py-1.5 rounded-lg bg-blue-600 text-white font-medium transition-colors cursor-pointer';
                } else {
                    btn.className = 'text-xs px-3 py-1.5 rounded-lg bg-slate-800 text-slate-400 hover:bg-slate-700 transition-colors cursor-pointer';
                }
            });
            renderAccounts();
        };

        function renderAccounts() {
            let filtered = accounts;
            if (currentFilter === 'limited') {
                filtered = accounts.filter(a => a.isLimited);
            } else if (currentFilter === 'normal') {
                filtered = accounts.filter(a => !a.isLimited);
            }

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                container.innerHTML = '';
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            const now = Date.now();
            let needsStateUpdate = false;

            container.innerHTML = filtered.map(acc => {
                let timeLeftText = "Bình thường";
                let progressPercent = 0;
                let isFinished = false;

                if (acc.isLimited && acc.endTime) {
                    const totalDuration = 24 * 60 * 60 * 1000;
                    const remaining = acc.endTime - now;

                    if (remaining <= 0) {
                        isFinished = true;
                        timeLeftText = "Đã xong reset!";
                        progressPercent = 100;

                        // Trigger notification & sound once when it hits finished
                        if (!acc.notified) {
                            acc.notified = true;
                            needsStateUpdate = true;
                            
                            // Play audio sound
                            playBeep();

                            // Trigger Browser Notification with check
                            if ("Notification" in window) {
                                if (Notification.permission === "granted") {
                                    try {
                                        new Notification("Tài khoản đã reset xong!", {
                                            body: `Tài khoản "${acc.name}" đã hoàn tất 24 giờ đếm ngược và sẵn sàng sử dụng.`,
                                            icon: "https://placehold.co/128x128/1e293b/38bdf8?text=OK"
                                        });
                                    } catch (e) {
                                        console.log("Notification error:", e);
                                    }
                                }
                            }
                        }
                    } else {
                        const hours = Math.floor(remaining / (1000 * 60 * 60));
                        const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
                        const seconds = Math.floor((remaining % (1000 * 60)) / 1000);
                        timeLeftText = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                        
                        const elapsed = totalDuration - remaining;
                        progressPercent = (elapsed / totalDuration) * 100;
                    }
                }

                const radius = 32;
                const circumference = 2 * Math.PI * radius;
                const strokeDashoffset = circumference - (progressPercent / 100) * circumference;

                return `
                    <div class="bg-slate-800/80 border ${acc.isLimited ? (isFinished ? 'border-emerald-500/50 bg-emerald-950/10' : 'border-amber-500/50') : 'border-slate-700/60'} rounded-2xl p-4 flex items-center justify-between shadow-md transition-all">
                        <div class="flex items-center gap-4">
                            <div class="relative w-20 h-20 flex items-center justify-center flex-shrink-0">
                                ${acc.isLimited ? `
                                    <svg class="w-full h-full transform -rotate-90">
                                        <circle cx="40" cy="40" r="${radius}" stroke="currentColor" stroke-width="6" class="text-slate-700 fill-transparent"></circle>
                                        <circle cx="40" cy="40" r="${radius}" stroke="currentColor" stroke-width="6" 
                                            class="${isFinished ? 'text-emerald-500' : 'text-amber-500'} fill-transparent transition-all duration-1000"
                                            stroke-dasharray="${circumference}" stroke-dashoffset="${strokeDashoffset}" stroke-linecap="round"></circle>
                                    </svg>
                                    <div class="absolute inset-0 flex flex-col items-center justify-center text-center p-1">
                                        <span class="text-[10px] font-bold ${isFinished ? 'text-emerald-400' : 'text-amber-400'} leading-tight">
                                            ${isFinished ? 'XONG' : timeLeftText}
                                        </span>
                                    </div>
                                ` : `
                                    <div class="w-16 h-16 rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center text-slate-400">
                                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                    </div>
                                `}
                            </div>

                            <div class="space-y-1">
                                <h3 class="font-semibold text-slate-100 text-base break-all">${escapeHtml(acc.name)}</h3>
                                <div class="flex items-center gap-2">
                                    <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ${acc.isLimited ? (isFinished ? 'bg-emerald-500/20 text-emerald-300' : 'bg-amber-500/20 text-amber-300 animate-pulse') : 'bg-slate-700 text-slate-300'}">
                                        ${acc.isLimited ? (isFinished ? 'Đã reset xong (24h)' : 'Đang đếm ngược') : 'Bình thường'}
                                    </span>
                                </div>
                                <p class="text-xs text-slate-400">
                                    ${acc.isLimited ? (isFinished ? 'Đã đủ 24h trôi qua.' : `Còn lại: <span class="font-mono font-bold text-slate-200">${timeLeftText}</span>`) : 'Hoạt động bình thường'}
                                </p>
                            </div>
                        </div>

                        <div class="flex flex-col gap-2 items-end">
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" ${acc.isLimited ? 'checked' : ''} onchange="toggleLimit('${acc.id}')" class="sr-only peer">
                                <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                            </label>
                            
                            <div class="flex items-center gap-1 mt-2">
                                ${acc.isLimited ? `
                                    <button onclick="resetTimer('${acc.id}')" title="Khởi động lại đồng hồ 24h" class="p-1.5 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-lg text-xs transition-colors cursor-pointer">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                                    </button>
                                ` : ''}
                                <button onclick="deleteAccount('${acc.id}')" title="Xóa tài khoản" class="p-1.5 bg-red-500/20 hover:bg-red-500/30 text-red-400 rounded-lg text-xs transition-colors cursor-pointer">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            if (needsStateUpdate) {
                saveAccounts();
            }
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Live Timer Loop (every second)
        setInterval(() => {
            if (accounts.some(a => a.isLimited)) {
                renderAccounts();
            }
        }, 1000);

        // Initial Load
        updateTotalCount();
        renderAccounts();
    </script>
</body>
</html>
